name: Weekly Market Report

on:
  workflow_dispatch:
  schedule:
    # Fridays at 20:05 UTC (adjust if you want)
    - cron: "5 20 * * 5"

jobs:
  run-weekly-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: weekly-market-cache-${{ github.run_id }}
          restore-keys: |
            weekly-market-cache-

      - name: Run weekly report
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_CC: ${{ secrets.EMAIL_CC }}
          EMAIL_BCC: ${{ secrets.EMAIL_BCC }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
        run: python weekly_report.py

      - name: Save state cache
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: weekly-market-cache-${{ github.run_id }}
